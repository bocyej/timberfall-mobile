<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B2420">
<title>Timberfall Island</title>
<style>
/* Design style: "Nordic woodcut" — carved shapes, warm ink outlines, bevelled wood and paper.
   All depth is static (gradients + fixed shadows): nothing blurred is ever animated. */
:root{
  --ink:#2B2420; --ink2:#4A3B31; --snow:#F4F1EA; --snow2:#E4DED2; --wood:#B5763C; --wood2:#8C5528;
  --ember:#E8743B; --pine:#2F5D50; --ice:#8FC8D8; --cash:#3E9B5A; --berry:#B8344F; --gold:#E7B43C; --danger:#C8453A;
  --r:12px;
  --lift:0 3px 0 var(--ink), 0 6px 10px rgba(0,0,0,.28);
  --bevel:inset 0 2px 0 rgba(255,255,255,.85), inset 0 -3px 0 rgba(43,36,32,.14);
  --paper:linear-gradient(180deg,#FFFDF8 0%,#EEE7D8 100%);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;touch-action:none;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;font-size:15px}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block;transform:translateZ(0)}
#gl{display:none;background:#9FB9C9}
.hud{position:absolute;pointer-events:none;inset:0;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.hud *{pointer-events:auto}
.row{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:2px 11px 2px 4px;font-weight:900;font-size:1.08em;box-shadow:var(--bevel),var(--lift);white-space:nowrap;line-height:1.25}
.chip svg{width:1.55em;height:1.55em;flex:none;filter:drop-shadow(0 1px 0 rgba(43,36,32,.35))}
.chip.cash{color:#24683A}
.portrait{width:54px;height:54px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:var(--lift);background:var(--snow);overflow:hidden;flex:none;position:relative}
.portrait::after{content:"";position:absolute;inset:0;border-radius:11px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.18);pointer-events:none}
.portrait canvas{width:100%;height:100%;display:block}
.clock{display:inline-block;margin-top:6px;font-size:.78em;font-weight:900;color:var(--snow);background:linear-gradient(180deg,#4A3B31,#2B2420);border:2px solid #1a1512;border-radius:999px;padding:2px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 6px rgba(0,0,0,.3);letter-spacing:.04em}
.clock.night{background:linear-gradient(180deg,#2C3B66,#18213D)}
.clock.storm{background:linear-gradient(180deg,#5D7B92,#34495A)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:7px;width:176px;padding:6px 8px 6px 7px;border-radius:12px;background:linear-gradient(180deg,rgba(43,36,32,.82),rgba(43,36,32,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.25);cursor:pointer}
.bar{display:grid;grid-template-columns:20px 1fr 26px;align-items:center;column-gap:5px;row-gap:1px;color:var(--snow)}
.bar svg{width:19px;height:19px;flex:none;filter:drop-shadow(0 1px 0 #000);grid-row:span 2}
.bar .lbl{font-size:.62em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85;line-height:1}
.bar .num{font-size:.72em;font-weight:900;text-align:right;grid-row:span 2;font-variant-numeric:tabular-nums}
.bar.low .lbl{color:#FF8A7E;opacity:1}
.bar.low .num{color:#FF8A7E}
.bar.low .track{animation:lowpulse .6s ease-in-out infinite alternate}
@keyframes lowpulse{from{border-color:#120e0c}to{border-color:#FF6B5E;box-shadow:0 0 8px rgba(255,107,94,.8)}}
.bar .track{height:10px;border:2px solid #120e0c;border-radius:7px;background:#1f1916;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.ntags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;min-height:16px}
.ntag{font-size:.6em;font-weight:900;padding:1px 6px;border-radius:7px;background:#5A2A24;color:#FFC9C2;border:1.5px solid #8E3A30;white-space:nowrap}
.ntag.good{background:#24452F;color:#BDF0C9;border-color:#3E7A50}
.mbar{display:flex;align-items:center;gap:7px;margin-top:7px;width:calc(100vw - 86px);max-width:360px;background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--snow);border:2px solid #120e0c;border-radius:12px;padding:5px 8px 6px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 10px rgba(0,0,0,.3);cursor:pointer}
.mbar .mi{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(180deg,#F5CF6A,#DDA12A);border:2px solid #120e0c;display:flex;align-items:center;justify-content:center}
.mbar .mi svg{width:19px;height:19px}
.mbar .mt{flex:1;min-width:0}
.mbar .mh{display:flex;justify-content:space-between;align-items:center;font-size:.6em;font-weight:900;letter-spacing:.1em;color:var(--gold)}
.mbar .mh .rw{display:inline-flex;gap:3px;align-items:center;color:#BDE3C5;letter-spacing:0;font-size:1.1em}
.mbar .mh svg{width:13px;height:13px}
.mbar .mx{font-size:.8em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px}
.mbar .mp{height:6px;border-radius:4px;background:#1a1512;overflow:hidden;border:1px solid #120e0c}
.mbar .mp i{display:block;height:100%;background:linear-gradient(90deg,#62BE7E,#9BE0A9);transform-origin:left}
.mbar.done{background:linear-gradient(180deg,#2F5D44,#1E3A2B)}
.bar .fill{height:100%;width:100%;transform-origin:left;border-radius:4px;background-image:linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,.08) 50%,rgba(0,0,0,.12) 100%)}
.packs{display:flex;gap:6px;margin-top:8px}
.packs .chip{font-size:.98em}
.packs .chip.full{background:linear-gradient(180deg,#E3675C,#C03A30);color:#fff}
.side{position:absolute;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 4px);display:flex;flex-direction:column;gap:7px}
.btn{font:inherit;border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);box-shadow:var(--bevel),var(--lift);font-weight:900;color:var(--ink);cursor:pointer;padding:8px 13px;font-size:.95em;position:relative}
.btn:active{transform:translateY(2px);box-shadow:var(--bevel),0 1px 0 var(--ink)}
.btn.primary{background:linear-gradient(180deg,#F59A62 0%,#DB6229 100%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18),var(--lift)}
.btn.green{background:linear-gradient(180deg,#62BE7E 0%,#2F8048 100%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),var(--lift)}
.btn.dark{background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--snow);border-color:#120e0c}
.btn:disabled{opacity:.5;filter:grayscale(.6)}
.ibtn{width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.6em;gap:1px}
.ibtn svg{width:25px;height:25px;filter:drop-shadow(0 1px 0 rgba(43,36,32,.3))}
.ibtn.hide{visibility:hidden;position:absolute}
.ibtn.shut{background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--gold);border-color:#120e0c}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:linear-gradient(180deg,#E3675C,#B8342A);color:#fff;border:2px solid var(--ink);font-size:11px;line-height:16px;text-align:center;visibility:hidden;font-weight:900}
.badge.on{visibility:visible}
.goal{position:absolute;right:8px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 10px);width:min(46vw,190px);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:var(--bevel),var(--lift);padding:6px 9px 8px;font-weight:900;font-size:.86em;pointer-events:none;line-height:1.2}
.goal .gh{display:flex;align-items:center;gap:6px;font-size:.68em;letter-spacing:.14em;color:var(--wood2);margin-bottom:4px}
.goal .gi{width:24px;height:24px;flex:none;border-radius:7px;background:linear-gradient(180deg,#F2C75A,#D99B22);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.goal .gi svg{width:15px;height:15px}
.goal.urgent{background:linear-gradient(180deg,#FFE9E4,#F6C9BF);border-color:#8E2620}
.goal.urgent .gh{color:#8E2620}
.goal.fresh{animation:gfresh .5s ease-out 3 alternate}
@keyframes gfresh{from{transform:scale(1)}to{transform:scale(1.06)}}
.ctx{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 212px);transform:translateX(-50%);visibility:hidden;display:flex;align-items:center;gap:9px;font-size:1.15em;padding:13px 24px 13px 16px;border-radius:999px;white-space:nowrap}
.ctx svg{width:30px;height:30px;flex:none;background:rgba(255,255,255,.9);border-radius:50%;padding:3px;border:2px solid var(--ink)}
.ctx.wait{background:linear-gradient(180deg,#8A9097,#5E656C)}
.ctx.bite{background:linear-gradient(180deg,#F05A4E,#B8342A);font-size:1.3em;animation:pulse .35s ease-in-out infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}
.ticker{position:absolute;right:8px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);width:max-content;max-width:calc(100% - 172px);text-overflow:ellipsis;background:linear-gradient(180deg,rgba(43,36,32,.88),rgba(43,36,32,.78));color:var(--snow);border:2px solid rgba(244,241,234,.7);border-radius:999px;padding:4px 12px;font-size:.78em;font-weight:800;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.3);cursor:pointer}
.ticker b{color:var(--gold);letter-spacing:.08em;font-size:.9em}
.ticker .tp{background:rgba(255,255,255,.15);border-radius:8px;padding:0 6px}
.ticker .tr{display:inline-flex;align-items:center;gap:2px;color:#BDE3C5}
.ticker svg{width:14px;height:14px;vertical-align:-3px}
.chip{cursor:pointer}
#dMove{display:flex;align-items:center;justify-content:center;gap:8px}
#dMove svg{width:22px;height:22px;filter:invert(1)}
.chip .stored{display:inline-flex;align-items:center;gap:1px;font-size:.72em;opacity:.8;margin-left:4px}
.chip .stored svg{width:1.2em;height:1.2em}
.ctx.on{visibility:visible}
.toasts{position:absolute;left:0;right:0;top:36%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--snow);border:2px solid var(--snow);border-radius:12px;padding:7px 15px;font-weight:900;font-size:.95em;animation:tin 2.4s ease forwards;box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.25);max-width:88vw;text-align:center}
.toast.gold{background:linear-gradient(180deg,#F5CF6A,#DDA12A);color:var(--ink);border-color:var(--ink)}
.toast.bad{background:linear-gradient(180deg,#DC5A4F,#AE3127)}
@keyframes tin{0%{opacity:0;transform:translateY(10px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#joy{position:absolute;left:0;top:0;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:3px solid rgba(244,241,234,.65);background:radial-gradient(circle,rgba(43,36,32,.08),rgba(43,36,32,.28));visibility:hidden;pointer-events:none}
#joy.fixed{width:124px;height:124px;margin:-62px 0 0 -62px;background:radial-gradient(circle,rgba(244,241,234,.18),rgba(43,36,32,.32));border:3px solid rgba(244,241,234,.75);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.25)}
.frost{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(235,244,250,0);transition:box-shadow 1.2s}
.frost.on{box-shadow:inset 0 0 90px 40px rgba(235,244,250,.85)}
.crate-btn{background:linear-gradient(180deg,#F5CF6A,#DDA12A);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:var(--bevel),var(--lift)}to{box-shadow:var(--bevel),var(--lift),0 0 16px 4px rgba(242,199,90,.9)}}
.body.crate{background:linear-gradient(180deg,#232A33,#1A1F26);color:#E8ECEF}
.reel{position:relative;height:132px;overflow:hidden;border-radius:10px;background:#12161B;border:2px solid #3A434E;margin-bottom:10px}
.reel .mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#F08A4B;z-index:2;box-shadow:0 0 10px #F08A4B}
.reel .mark::before{content:"";position:absolute;top:-2px;left:-6px;border:7px solid transparent;border-top-color:#F08A4B}
.strip{display:flex;gap:6px;padding:8px 6px;will-change:transform}
.lcard{flex:none;width:92px;height:112px;border-radius:8px;background:linear-gradient(180deg,#2A323C,#1E242C);border-top:4px solid var(--rc);display:flex;flex-direction:column;align-items:center;padding:8px 4px 4px;box-shadow:inset 0 -30px 30px -20px var(--rc)}
.lcard .li{width:48px;height:48px}.lcard .li svg{width:100%;height:100%}
.lcard .ln{font-size:.72em;font-weight:900;text-align:center;margin-top:4px;line-height:1.1}
.lcard .lr{font-size:.6em;font-weight:800;color:var(--rc);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.lcard.big{width:110px;height:130px}
.crres{min-height:0}
.youwin{display:flex;gap:10px;align-items:center;background:#12161B;border:2px solid var(--rc);border-radius:12px;padding:8px;margin-bottom:10px;box-shadow:0 0 22px -4px var(--rc);font-size:.9em}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.lmini{display:flex;align-items:center;gap:6px;background:#12161B;border-left:4px solid var(--rc);border-radius:6px;padding:4px 6px;font-size:.74em;font-weight:800}
.lmini svg{width:22px;height:22px;flex:none}.lmini span{flex:1}.lmini b{color:var(--rc)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:var(--bevel),var(--lift)}
.modal{position:absolute;inset:0;background:rgba(20,16,14,.62);display:flex;align-items:center;justify-content:center;padding:14px;visibility:hidden}
.modal.on{visibility:visible}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink),0 14px 30px rgba(0,0,0,.4);width:min(100%,430px);max-height:90%;display:flex;flex-direction:column;overflow:hidden}
.card h2{margin:0;padding:11px 14px;background:repeating-linear-gradient(177deg,rgba(0,0,0,.07) 0 2px,transparent 2px 8px),linear-gradient(180deg,#CC8D50,#A5672F);color:#fff;font-size:1.08em;letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 0 var(--wood2);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.card h2 .x{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:9px;width:32px;height:32px;font-weight:900;font-size:16px;line-height:27px;text-align:center;cursor:pointer;text-shadow:none;box-shadow:var(--bevel)}
.card .body{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.sect{font-size:.74em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--wood2);margin:10px 0 6px}
.item{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:13px;padding:8px 10px;margin-bottom:8px;background:linear-gradient(180deg,#FFFFFF,#F5F0E6);box-shadow:inset 0 -3px 0 rgba(43,36,32,.08),0 2px 0 rgba(43,36,32,.5)}
.item .t{flex:1;min-width:0;font-weight:800;font-size:.9em}
.item .sub{font-size:.8em;font-weight:700;color:var(--ink2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .sub svg{width:15px;height:15px;vertical-align:-3px}
.prog{height:9px;border:2px solid var(--ink);border-radius:6px;background:#D9D1C1;margin-top:5px;overflow:hidden;box-shadow:inset 0 2px 2px rgba(0,0,0,.2)}
.prog i{display:block;height:100%;background:linear-gradient(180deg,#6ACB86,#2F8048)}
.item .btn{padding:6px 10px;font-size:.82em}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.sw{width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.74em;font-weight:900;background:var(--paper);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.14)}
.sw.sel{outline:3px solid var(--ember);outline-offset:1px}
.avprev{width:100%;aspect-ratio:16/7;border:3px solid var(--ink);border-radius:13px;overflow:hidden;position:sticky;top:-12px;z-index:2;box-shadow:0 4px 0 rgba(43,36,32,.6)}
.avprev canvas{width:100%;height:100%;display:block}
/* notice board */
.cork{background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.08) 0 2px,transparent 3px) 0 0/17px 17px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 0 2px,transparent 3px) 0 0/23px 23px,linear-gradient(180deg,#C49460,#A97845);box-shadow:inset 0 0 0 6px #7A4A25,inset 0 0 0 9px #5E3A1D,inset 0 6px 14px rgba(0,0,0,.35);padding:16px 14px !important}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .btn{flex:1;padding:7px 6px;font-size:.85em}
.tabs .btn.on{background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--gold)}
.note{position:relative;background:linear-gradient(180deg,#FFFEF7,#F3ECD9);border-radius:3px;padding:12px 12px 10px;margin:0 2px 14px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 10px rgba(0,0,0,.22);font-size:.88em;font-weight:700;color:var(--ink)}
.note:nth-child(odd){transform:rotate(-1.2deg)} .note:nth-child(even){transform:rotate(1deg)}
.note::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F28A80,#B8342A);border:1.5px solid var(--ink);box-shadow:0 2px 2px rgba(0,0,0,.35)}
.note.letter{background:linear-gradient(180deg,#F0F6F8,#DCE9EE)}
.note.letter::before{background:radial-gradient(circle at 35% 35%,#8FD0E0,#3C7DC4)}
.note h4{margin:0 0 4px;font-size:1em;font-family:Georgia,"Times New Roman",serif;font-style:italic}
.note .from{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;color:var(--wood2);margin-bottom:3px}
.note .new{position:absolute;right:8px;top:8px;background:var(--danger);color:#fff;font-size:.68em;padding:1px 6px;border-radius:6px}
.note.locked{opacity:.55;font-style:italic}
.note .row{justify-content:space-between}
.note svg{width:18px;height:18px;vertical-align:-4px;margin-right:2px}
.note .sub span{display:inline-flex;align-items:center;gap:2px;margin-right:6px;font-weight:900}
.dialog{position:absolute;left:10px;right:10px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 8px);display:flex;gap:10px;align-items:flex-end;visibility:hidden}
.dialog.on{visibility:visible}
.dialog .who{width:88px;height:110px;flex:none;border:3px solid var(--ink);border-radius:15px;background:var(--ice);overflow:hidden;box-shadow:var(--lift)}
.dialog .who canvas{width:100%;height:100%}
.dialog .say{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:15px;box-shadow:var(--bevel),var(--lift);padding:10px 12px}
.dialog .nm{font-weight:900;font-size:.8em;color:var(--wood2);letter-spacing:.08em;text-transform:uppercase}
.dialog .tx{font-weight:700;font-size:.95em;margin:4px 0 8px;min-height:3.6em}
.cine{position:absolute;inset:0;visibility:hidden}
.cine.on{visibility:visible}
.cap{position:absolute;left:0;right:0;bottom:13%;text-align:center;color:var(--snow);font-weight:900;font-size:1.12em;padding:0 26px;text-shadow:0 2px 0 #000,0 0 10px #000;line-height:1.4;font-family:Georgia,"Times New Roman",serif;letter-spacing:.02em}
.cap.shout{font-family:"Trebuchet MS",sans-serif;font-size:1.55em;color:#FF6B5E;letter-spacing:.06em;animation:shout .12s ease-in-out infinite alternate}
@keyframes shout{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.cap.radio{font-family:"Courier New",monospace;color:#BDF0C9;font-size:1em;font-weight:700}
.chap{position:absolute;left:0;right:0;top:13%;text-align:center;color:var(--gold);font-weight:900;font-size:.72em;letter-spacing:.32em;text-transform:uppercase;text-shadow:0 2px 0 #000}
.skip{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top))}

.movebar{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 150px);transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,#4A3B31,#2B2420);color:var(--snow);border-radius:13px;padding:6px 6px 6px 12px;font-weight:800;font-size:.9em;visibility:hidden;border:2px solid var(--snow);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.movebar.on{visibility:visible}
.vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 20px rgba(200,69,58,0)}
.vign.on{box-shadow:inset 0 0 70px 18px rgba(200,69,58,.55)}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>
  <div class="vign" id="vign"></div>
  <div class="frost" id="frost"></div>

  <div class="hud" id="hud" style="visibility:hidden">

    <div class="movebar" id="movebar"><span id="moveText">Tap a building to move it</span><button class="btn" id="moveRot" style="padding:5px 9px;display:none">Rotate</button><button class="btn" id="moveStore" style="padding:5px 9px;display:none">Put away</button><button class="btn green" id="moveDone" style="padding:5px 10px">Done</button></div>
  </div>

  <div class="dialog" id="dialog">

  </div>

  <div class="modal" id="modal"><div class="card"><h2><span id="mTitle"></span><span class="x" id="mClose">&#x2715;</span></h2><div class="body" id="mBody"></div></div></div>

  <div class="cine" id="cine"><div class="chap" id="chap"></div><div class="cap" id="cap"></div><div class="tap">TAP TO CONTINUE</div><button class="btn skip" id="skip">Skip</button></div>
  <div class="title" id="title">
    <div class="logo">TIMBERFALL<br>ISLAND<small>SURVIVE &middot; BUILD &middot; TRADE</small></div>
    <button class="btn primary" id="play" style="font-size:1.25em;padding:13px 38px">Play</button>
    <div class="ver" id="ver"></div>
  </div>
</div>
<script>/* Timberfall Island — pure game rules. No DOM. Deterministic with a seeded RNG.
   Shared by the game, the node tests and the simulated player. */
(function (root) {
  'use strict';
  const VERSION = '0.6.0';
  const SCHEMA = 5;
  const MAP = 64;                 // v0.6: the island grew east (Timber Valley)
  const OLD_MAP = 48;             // world generation keeps the original 48x48 layout identical
  const CAMP = { x: 12, y: 18 };
  const DAY_LEN = 170;            // seconds per in-game day
  const NIGHT_START = 0.6;        // fraction of the day when night falls (nights are 40% of a day)
  const SEA_Y = 40;               // south of this is open sea
  const DOCK = { x: 12.5, y: 39.4 }; // Northline barge dock: trucks arrive here
  const WALL_R = 4.6;             // palisade ring radius around camp
  const GATE_HALF = 0.62 / WALL_R; // half-width of a gate opening (radians)
  const GATE_ANGLE = { front: Math.atan2(Math.sqrt(WALL_R * WALL_R - 0.25), 0.5), back: Math.atan2(-Math.sqrt(WALL_R * WALL_R - 0.25), 0.5) };

  // ---------- RNG ----------
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const angDiff = (a, b) => { let d = Math.abs(a - b) % (Math.PI * 2); return d > Math.PI ? Math.PI * 2 - d : d; };

  // ---------- Regions ----------
  const REGIONS = {
    clearing: { name: 'Crash Clearing', cost: null },
    shore: { name: 'Wreck Shore', cost: { cash: 250, maps: 1 } },
    lake: { name: 'Frozen Lake', cost: { cash: 600, maps: 2 } },
    deepwoods: { name: 'Deep Woods', cost: { cash: 1000, maps: 3 } },
    ridge: { name: 'Pine Ridge', cost: { cash: 1600, maps: 4 } },
    valley: { name: 'Timber Valley', cost: { cash: 2800, maps: 5 } },
  };
  const SIGNS = { shore: { x: 17, y: 31.6 }, lake: { x: 27.6, y: 14 }, ridge: { x: 12, y: 8.4 }, deepwoods: { x: 39.6, y: 21 }, valley: { x: 49.6, y: 24.5 } };
  function regionOf(x, y) {
    if (x < 0 || y < 0 || x >= MAP || y >= MAP) return null;
    if (y >= SEA_Y) return null; // sea
    if (y < 8) return 'ridge';
    if (y >= 32) return x >= 3 ? 'shore' : null;
    if (x >= 50) return 'valley';
    if (x >= 40) return 'deepwoods';
    if (x >= 28) return 'lake';
    if (x >= 3) return 'clearing';
    return null; // west cliffs: never walkable
  }
  // ---------- Roads: one network, used by the trucks and drawn by the renderer ----------
  const BARGE = { x: 12.5, y: 42.4 };   // trucks roll off the barge and up the dock
  const ROADS = [
    [12.5, 42.4, 12.5, 25.8], // dock road
    [8.2, 25.8, 19.5, 25.8],  // camp lane
    [19.5, 25.8, 19.5, 5.8],  // north road
    [19.5, 5.8, 13.4, 5.8],   // ridge spur
    [19.5, 18.9, 29.6, 18.9], // lake road
    [12.5, 31, 52, 31],       // old logging road east
    [52, 31, 52, 14],         // valley road
  ];
  function segPoint(px, py, r) { const dx = r[2] - r[0], dy = r[3] - r[1], l2 = dx * dx + dy * dy; let k = l2 ? ((px - r[0]) * dx + (py - r[1]) * dy) / l2 : 0; k = Math.max(0, Math.min(1, k)); return { x: r[0] + dx * k, y: r[1] + dy * k, k }; }
  function roadDist(x, y) { let best = 1e9; for (const r of ROADS) { const q = segPoint(x, y, r); best = Math.min(best, Math.hypot(q.x - x, q.y - y)); } return best; }
  // shortest drive along the network from the barge to the road point nearest (x, y), then a short driveway
  function roadRoute(x, y) {
    const key = (p) => Math.round(p.x * 10) + ',' + Math.round(p.y * 10);
    const nodes = new Map(), edges = new Map();
    const node = (p) => { const k = key(p); if (!nodes.has(k)) { nodes.set(k, { x: p.x, y: p.y }); edges.set(k, []); } return k; };
    // split each road at the points where other roads meet it
    const cuts = ROADS.map((r) => [0, 1]);
    ROADS.forEach((r, i) => ROADS.forEach((o, j) => { if (i === j) return; for (const e of [[o[0], o[1]], [o[2], o[3]]]) { const q = segPoint(e[0], e[1], r); if (Math.hypot(q.x - e[0], q.y - e[1]) < 0.05) cuts[i].push(q.k); } }));
    let best = null;
    ROADS.forEach((r, i) => { const q = segPoint(x, y, r), d = Math.hypot(q.x - x, q.y - y); if (!best || d < best.d - 1e-6) best = { i, q, d }; });
    cuts[best.i].push(best.q.k);
    ROADS.forEach((r, i) => {
      const ks = [...new Set(cuts[i].map((k) => Math.round(k * 1e4) / 1e4))].sort((a, b) => a - b);
      for (let n = 0; n < ks.length - 1; n++) {
        const a = node({ x: r[0] + (r[2] - r[0]) * ks[n], y: r[1] + (r[3] - r[1]) * ks[n] }), b = node({ x: r[0] + (r[2] - r[0]) * ks[n + 1], y: r[1] + (r[3] - r[1]) * ks[n + 1] });
        const w = dist(nodes.get(a), nodes.get(b)); edges.get(a).push([b, w]); edges.get(b).push([a, w]);
      }
    });
    const start = node(BARGE), goal = node(best.q), D = new Map([[start, 0]]), prev = new Map(), open = [start];
    while (open.length) { open.sort((a, b) => D.get(a) - D.get(b)); const u = open.shift(); if (u === goal) break; for (const [v, w] of edges.get(u)) { const nd = D.get(u) + w; if (!D.has(v) || nd < D.get(v)) { D.set(v, nd); prev.set(v, u); open.push(v); } } }
    const path = []; for (let u = goal; u; u = prev.get(u)) path.unshift(nodes.get(u)); path.shift(); // drop the barge itself
    path.push({ x, y });
    return path;
  }
  function truckStop(b) { return { x: b.x + 0.9, y: b.y + 0.9 }; }
  function isIce(x, y) { return regionOf(x, y) === 'lake' && x >= 30.5 && x < 37.5 && y >= 10.5 && y < 29.5; }
  function isSand(x, y) { return regionOf(x, y) === 'shore' && y >= 36.5; }

  // ---------- Content tables ----------
  const FOODS = ['berries', 'fish', 'meat'];
  const RES = ['wood', 'berries', 'meat', 'fish'];
  const FOOD = { berries: 18, meat: 35, fish: 30 };
  const PRICE = { wood: 3, berries: 4, fish: 10, meat: 8 };
  // what each trade building buys, and any premium it pays
  const TRADE = {
    logyard: { accept: ['wood'], price: {} },
    berrystand: { accept: ['berries', 'fish', 'meat'], price: {} },
    fishmarket: { accept: ['fish'], price: { fish: 12 } },
    hunterlodge: { accept: ['meat'], price: { meat: 10 } },
  };
  const STORE_MAX = 300; // wood the storage stockpile can hold

  // ---------- Decorations (buy, place, move, put away) ----------
  const DECOR = {
    lamp: { name: 'Lantern post', cost: { cash: 60 }, light: true },
    snowman: { name: 'Snowman', cost: { wood: 5 } },
    bench: { name: 'Log bench', cost: { wood: 12 } },
    flag: { name: 'Camp flag', cost: { cash: 40 } },
    planter: { name: 'Pine planter', cost: { wood: 8, cash: 20 } },
    crates: { name: 'Crate stack', cost: { wood: 10 } },
    sled: { name: 'Wooden sled', cost: { wood: 15, cash: 30 } },
    path: { name: 'Stone path', cost: { cash: 10 }, flat: true },
    fence: { name: 'Short fence', cost: { wood: 6 } },
    totem: { name: 'Carved totem', cost: { wood: 25, cash: 120 } },
    icesculpture: { name: 'Ice sculpture', cost: null, exclusive: true },
    bearstatue: { name: 'Golden bear statue', cost: null, exclusive: true },
  };
  const STYLE_MAX = { roof: 4, flag: 6 };

  // ---------- Supply crates (rare drops from chopping) ----------
  const RARITY = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
  const LOOT = [
    { id: 'cash100', name: '$100', rarity: 0, w: 30, give: { cash: 100 } },
    { id: 'wood40', name: '40 wood', rarity: 0, w: 26, give: { wood: 40 } },
    { id: 'cash300', name: '$300', rarity: 1, w: 16, give: { cash: 300 } },
    { id: 'map1', name: 'Survey map', rarity: 1, w: 12, give: { maps: 1 } },
    { id: 'lamp', name: 'Lantern post', rarity: 1, w: 8, give: { decor: 'lamp' } },
    { id: 'map2', name: '2 survey maps', rarity: 2, w: 5, give: { maps: 2 } },
    { id: 'totem', name: 'Carved totem', rarity: 2, w: 4, give: { decor: 'totem' } },
    { id: 'ice', name: 'Ice sculpture', rarity: 3, w: 2.2, give: { decor: 'icesculpture' } },
    { id: 'goldaxe', name: 'Golden axe skin', rarity: 3, w: 1.2, give: { skin: 'gold' } },
    { id: 'cash2000', name: '$2,000', rarity: 4, w: 0.5, give: { cash: 2000 } },
    { id: 'bearstatue', name: 'Golden bear statue', rarity: 4, w: 0.3, give: { decor: 'bearstatue' } },
  ];
  const LOOT_CHANCE = 0.008, LOOT_FIRST = 25, LOOT_PITY = 200;
  const AXES = [
    { name: 'Crash Axe', power: 1, cost: null },
    { name: 'Iron Axe', power: 2, cost: { wood: 40, cash: 150 } },
    { name: 'Steel Axe', power: 3, cost: { wood: 80, cash: 600 } },
    { name: 'Twin Axes', power: 5, cost: { wood: 150, cash: 2500 } },
  ];
  function packCost(lvl) { return { cash: Math.round(80 * Math.pow(lvl + 1, 1.6)) }; }
  function bootsCost(lvl) { return { cash: Math.round(120 * Math.pow(lvl + 1, 1.7)) }; }
  const PACK_MAX = 8, BOOTS_MAX = 5;

  const ANIMALS = {
    hare: { name: 'Snow hare', hp: 1, speed: 3.2, meat: 1, role: 'prey', respawn: 30 },
    deer: { name: 'Deer', hp: 3, speed: 2.6, meat: 3, role: 'prey', respawn: 60 },
    fox: { name: 'Arctic fox', hp: 2, speed: 3.0, role: 'thief' },
    wolf: { name: 'Wolf', hp: 3, speed: 2.4, dmgP: 9, dmgB: 7, role: 'hostile', fearFire: true },
    bear: { name: 'Polar bear', hp: 12, speed: 1.7, dmgP: 11, dmgB: 12, role: 'hostile', fearFire: false, gate: 4, meat: 6, stays: true },
  };

  // Build sites. Each site builds one building; `levels` lists the cost of each level.
  const SITES = [
    { id: 'campfire', kind: 'campfire', x: 12, y: 18, levels: [{ wood: 8 }], req: () => true },
    { id: 'board', kind: 'board', x: 13.8, y: 20.6, levels: [{ wood: 10 }], req: (s) => has(s, 'campfire') },
    { id: 'shelter', kind: 'house', x: 9.5, y: 15.5, levels: [{ wood: 25 }, { wood: 60, cash: 200 }, { wood: 150, cash: 1200 }],
      req: (s, lvl) => has(s, 'campfire') && (lvl === 0 || s.flags.biz) },
    { id: 'storage', kind: 'storage', x: 14.5, y: 15.5, levels: [{ wood: 20 }], req: (s) => has(s, 'shelter') },
    { id: 'palisade', kind: 'palisade', x: 12, y: 21.4, levels: [{ wood: 45 }], req: (s) => has(s, 'shelter') && s.stats.nights >= 1 },
    { id: 'backgate', kind: 'backgate', x: 12.5, y: 14.8, levels: [{ wood: 20 }], req: (s) => has(s, 'palisade') },
    { id: 'workbench', kind: 'workbench', x: 15.5, y: 19.5, levels: [{ wood: 30 }], req: (s) => has(s, 'storage') },
    { id: 'logyard', kind: 'logyard', x: 15.2, y: 24.6, levels: [{ wood: 40 }], req: (s) => s.flags.biz, trade: true },
    { id: 'berrystand', kind: 'berrystand', x: 9, y: 24.6, levels: [{ wood: 30, cash: 60 }], req: (s) => s.flags.biz && has(s, 'logyard'), trade: true },
    { id: 'lumbercamp', kind: 'lumbercamp', x: 6.2, y: 20.6, levels: [{ wood: 50, cash: 300 }], req: (s) => has(s, 'logyard') && s.axe >= 1 },
    { id: 'fishmarket', kind: 'fishmarket', x: 28.9, y: 18, levels: [{ wood: 50, cash: 150 }], req: (s) => s.regions.lake, trade: true },
    { id: 'hunterlodge', kind: 'hunterlodge', x: 12, y: 5, levels: [{ wood: 80, cash: 400 }], req: (s) => s.regions.ridge, trade: true },
  ];
  const SITE = Object.fromEntries(SITES.map((s) => [s.id, s]));
  const MOVABLE = new Set(['campfire', 'board', 'shelter', 'storage', 'workbench', 'logyard', 'berrystand', 'lumbercamp', 'fishmarket', 'hunterlodge']);
  const NO_RAID = new Set(['palisade', 'backgate', 'board']);
  function has(s, id) { return !!s.buildings[id]; }
  function working(s, id) { const b = s.buildings[id]; return !!b && b.hp > 0; }

  // ---------- Notes on the notice board (journal + letters) ----------
  const NOTES = [
    { id: 'j1', from: 'journal', title: 'Day 1', text: 'The pilot\'s seat is empty. So is every other seat. I found an axe under the cargo net. Fire first. Then a roof.', when: (s) => true },
    { id: 'j2', from: 'journal', title: 'A small flame', text: 'Fire is going. Funny how one small flame makes a whole forest feel smaller. Berries by the rocks taste like summer.', when: (s) => has(s, 'campfire') },
    { id: 'j3', from: 'journal', title: 'They circled', text: 'Wolves circled until dawn. They hate the fire. Next time they will not stop at the edge of the light. I need a wall.', when: (s) => s.stats.nights >= 1 },
    { id: 'j4', from: 'journal', title: 'A gate that closes', text: 'Built the wall log by log and dropped the bar across the gate. First real sleep since the crash.', when: (s) => has(s, 'palisade') },
    { id: 'j5', from: 'journal', title: 'Engine noise', text: 'Heard an engine to the south this morning. Not a plane. A truck? Out here? I am either rescued or losing my mind.', when: (s) => s.lastDay >= 3 && has(s, 'storage') },
    { id: 'm1', from: 'mara', title: 'Partner,', text: 'Northline is a small outfit with big trucks. You cut, we haul, everybody eats. Do not let the wolves eat you first. - M.V.', when: (s) => s.flags.biz },
    { id: 'm2', from: 'mara', title: 'First load', text: 'Your first load sold at the harbor before noon. Buyers asked who cuts wood this clean. I said a castaway with an axe. They laughed. I did not.', when: (s) => s.stats.soldWood > 0 },
    { id: 'm3', from: 'mara', title: 'The black box', text: 'Your plane\'s black box washed up near our dock. The storm was on no chart. You were very, very lucky. Salvage what you can from the shore.', when: (s) => s.regions.shore },
    { id: 'm4', from: 'mara', title: '$1,000', text: 'A thousand dollars in. That is the point where my partners quit or get serious. I am betting on serious.', when: (s) => s.stats.earned >= 1000 },
    { id: 'm5', from: 'mara', title: 'Ice fishers', text: 'The ice fishers at the harbor pay well for anything from your lake. Keep those holes open.', when: (s) => s.regions.lake },
    { id: 'm6', from: 'mara', title: 'White bears', text: 'Careful up on the ridge. The big white bears come down when the snow is deep, and they can break a gate. Keep wood ready for repairs.', when: (s) => s.regions.ridge || s.stats.bears > 0 },
    { id: 'm7', from: 'mara', title: 'Next season', text: 'A lodge! At this rate I need more trucks, or a bigger dock. Let us talk next season. - M.', when: (s) => level(s, 'shelter') >= 3 },
  ];
  function checkNotes(s, ev) {
    for (const n of NOTES) if (!s.notes.got.includes(n.id) && n.when(s)) { s.notes.got.push(n.id); s.notes.unread.push(n.id); if (ev) ev.push({ type: 'note', id: n.id, from: n.from }); }
  }
  function readNote(s, id) { s.notes.unread = s.notes.unread.filter((x) => x !== id); }

  // ---------- Missions (posted on the notice board) ----------
  const MISSION_POOL = [
    { key: 'chop', text: 'Chop {n} trees', d: 12, w: 80 },
    { key: 'berries', text: 'Gather {n} berries', d: 15, w: 90 },
    { key: 'predators', text: 'Drive off {n} predators', d: 3, w: 20 },
    { key: 'sold', text: 'Sell {n} goods to Northline', d: 40, w: 400 },
    { key: 'earned', text: 'Earn ${n}', d: 150, w: 1500 },
    { key: 'built', text: 'Build or upgrade {n} times', d: 1, w: 6 },
    { key: 'nights', text: 'Survive {n} nights', d: 1, w: 5 },
    { key: 'fish', text: 'Catch {n} fish', d: 8, w: 50, needs: 'lake' },
    { key: 'meat', text: 'Hunt {n} meat', d: 6, w: 50 },
    { key: 'repaired', text: 'Repair {n} damage', d: 40, w: 300, needsB: 'palisade' },
  ];
  function genMissions(s, key, weekly) {
    const r = rng(hashStr(key + (weekly ? 'W' : 'D') + s.seed));
    const pool = MISSION_POOL.filter((m) => (!m.needs || s.regions[m.needs]) && (!m.needsB || has(s, m.needsB)) && ((m.key !== 'sold' && m.key !== 'earned') || s.flags.biz));
    const out = [];
    while (out.length < 3 && pool.length) {
      const m = pool.splice(Math.floor(r() * pool.length), 1)[0];

    for (let i = 0; i < 9; i++) { const x = (i + 0.2) * W / 8, s = 34 + (i % 3) * 14, y = H * 0.86; ctx.fillStyle = i % 2 ? '#2F5D50' : '#24493F'; ctx.beginPath(); ctx.moveTo(x, y - s * 2.4); ctx.lineTo(x - s * 0.6, y); ctx.lineTo(x + s * 0.6, y); ctx.fill(); ctx.fillStyle = '#F4F1EA'; ctx.beginPath(); ctx.moveTo(x, y - s * 2.4); ctx.lineTo(x - s * 0.2, y - s * 1.7); ctx.lineTo(x + s * 0.2, y - s * 1.7); ctx.fill(); }
    ctx.fillStyle = '#EEEBE3'; ctx.fillRect(0, H * 0.86, W, H);
  }
  function boot() {
    resize();
    setRenderer(settings.renderer !== '2d');
    $('ver').textContent = 'v' + T.VERSION;
    const saved = loadSave();
    S = saved || T.createState((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    refreshMissions(); if (!use3D) buildGround(); drawPortrait();
    cam.x = isoX(S.player.x, S.player.y); cam.y = isoY(S.player.x, S.player.y);
    $('play').textContent = saved ? 'Continue' : 'Play';
    $('title').classList.add('on'); drawTitleBg();
    $('play').onclick = () => {
      sfx('pop');
      if (!S.flags.introSeen) startCine(true);
      else {
        mode = 'play'; $('title').classList.remove('on'); $('hud').style.visibility = 'visible'; last = performance.now();
        if (saveProblem) { toast('Your old save could not be read, so a new game started. It was kept as a backup.', 'bad'); saveProblem = null; }
        if (migratedNote) { toast('Updated to v' + T.VERSION + ' - Timber Valley found in the east, and trucks now use roads!', 'gold'); migratedNote = null; }
        if (S.flags.entrepreneurDue && !S.flags.biz) startEntrepreneur();
      }
    };
    new ResizeObserver(() => { if (mode === 'title') drawTitleBg(); }).observe(app);
    requestAnimationFrame(frame);
  }

  

  boot();
})();
